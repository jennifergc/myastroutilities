[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "myastroutilities"
version = "0.1.0"
description = "A collection of reusable Python utilities for radio astronomy data analysis, including spectral cube handling, position-velocity diagram extraction, moment map computation, and FITS image visualization."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jennifer Grisales", email = "" }
]
keywords = [
    "astronomy",
    "radio astronomy",
    "spectral cube",
    "FITS",
    "position-velocity diagram",
    "moment maps",
    "interferometry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "spectral-cube>=0.6",
    "scipy>=1.11",
    "reproject>=0.13",
    "bettermoments>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "numpydoc>=1.6",
]

[project.urls]
Homepage = "https://github.com/jennifergc/myastroutilities"
Repository = "https://github.com/jennifergc/myastroutilities"
"Bug Tracker" = "https://github.com/jennifergc/myastroutilities/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"
